[package]
name = "rustpad"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
log = "0.4.35"
anyhow = "1.0.104"
rfd = "0.18.0"
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }